[package]
name = "calchy"
version = "1.4.1"
description = "Calcolatrice testuale per Linux e Android, ispirata a Numi"
edition = "2021"
license = "MIT"

[lib]
name = "calchy_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = [] }
serde = { version = "1", features = ["derive"] }

# Solo per Android: per impostare la WebView (zoom del testo)
[target.'cfg(target_os = "android")'.dependencies]
jni = "0.21"

# Solo per Linux: su Android non servono
[target.'cfg(not(any(target_os = "android", target_os = "ios")))'.dependencies]
tauri-plugin-single-instance = "2"

[profile.release]
codegen-units = 1
lto = true
opt-level = "s"
strip = true
panic = "abort"
