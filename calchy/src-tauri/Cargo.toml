[package]
name = "calchy"
version = "1.2.1"
description = "Calcolatrice testuale per Linux, ispirata a Numi"
edition = "2021"
license = "MIT"

[lib]
name = "calchy_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = [] }
tauri-plugin-single-instance = "2"
serde = { version = "1", features = ["derive"] }

[profile.release]
codegen-units = 1
lto = true
opt-level = "s"
strip = true
panic = "abort"
