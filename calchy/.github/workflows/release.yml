# Crea l'RPM su un sistema Fedora e lo pubblica nella pagina "Releases" di GitHub.
# Si avvia da solo quando pubblichi un tag di versione, es. v1.0.0
name: Release RPM

on:
  push:
    tags: ["v*"]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  rpm:
    runs-on: ubuntu-latest
    container: fedora:44
    steps:
      - name: Installa gli strumenti di compilazione
        run: |
          dnf install -y git nodejs npm rust cargo gcc \
            webkit2gtk4.1-devel gtk3-devel librsvg2-devel openssl-devel

      - uses: actions/checkout@v4

      - uses: actions/cache@v4
        with:
          path: |
            ~/.cargo/registry
            src-tauri/target
          key: fedora44-${{ hashFiles('src-tauri/Cargo.lock') }}

      - name: Dipendenze JavaScript
        run: npm ci

      - name: Test del motore di calcolo
        run: npm test

      - name: Compila l'RPM
        run: |
          # La versione dell'RPM viene presa dal tag (v1.2.0 -> 1.2.0)
          if [[ "$GITHUB_REF_TYPE" == "tag" ]]; then
            VERSION="${GITHUB_REF_NAME#v}"
            npx tauri build --bundles rpm --config "{\"version\":\"$VERSION\"}"
          else
            npx tauri build --bundles rpm
          fi
        shell: bash

      - uses: actions/upload-artifact@v4
        with:
          name: calchy-rpm
          path: src-tauri/target/release/bundle/rpm/*.rpm

      - name: Pubblica la release
        if: github.ref_type == 'tag'
        uses: softprops/action-gh-release@v2
        with:
          files: src-tauri/target/release/bundle/rpm/*.rpm
          generate_release_notes: true
