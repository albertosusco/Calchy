<!doctype html>
<html lang="it">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover, interactive-widget=resizes-content" />
    <title>Calchy</title>
    <link rel="stylesheet" href="/src/styles.css" />
    <script type="module" src="/src/main.js"></script>
  </head>
  <body>
    <div id="app">
      <header id="titlebar" data-tauri-drag-region>
        <span id="title" data-tauri-drag-region></span>
        <div class="spacer" data-tauri-drag-region></div>
        <button id="pin" class="icon-btn desktop-only" title="Sempre in primo piano" aria-pressed="false">
          <svg viewBox="0 0 16 16"><path d="M9.8 1.5 14.5 6.2l-1.4.7-2.3 2.3.4 3.3-1.2 1.2-2.8-2.8-3.5 3.5-.7-.7 3.5-3.5L3.7 7.4l1.2-1.2 3.3.4 2.3-2.3z"/></svg>
        </button>
        <button id="settings-btn" class="icon-btn" title="Impostazioni">
          <svg viewBox="0 0 16 16"><path d="M7 1h2l.4 1.9 1.3.6 1.7-1 1.4 1.4-1 1.7.6 1.3L15 7v2l-1.9.4-.6 1.3 1 1.7-1.4 1.4-1.7-1-1.3.6L9 15H7l-.4-1.9-1.3-.6-1.7 1-1.4-1.4 1-1.7-.6-1.3L1 9V7l1.9-.4.6-1.3-1-1.7 1.4-1.4 1.7 1 1.3-.6zm1 4.5a2.5 2.5 0 1 0 0 5 2.5 2.5 0 0 0 0-5"/></svg>
        </button>
        <button id="close" class="icon-btn desktop-only" title="Nascondi (Esc)">
          <svg viewBox="0 0 16 16"><path d="m4.2 3.5 3.8 3.8 3.8-3.8.7.7L8.7 8l3.8 3.8-.7.7L8 8.7l-3.8 3.8-.7-.7L7.3 8 3.5 4.2z"/></svg>
        </button>
      </header>

      <main>
        <!-- Tab di calcolo (il testo cambia in base al tab scelto) -->
        <section id="calc-view" class="view active">
          <div id="gutter" title="Clic per inserire il richiamo nel testo"></div>
          <div id="editor-wrap">
            <div id="backdrop" aria-hidden="true"></div>
            <textarea id="editor" spellcheck="false"
              placeholder="Scrivi qui… testo o calcoli&#10;&#10;20 _mele_ + 30 _pere_&#10;@1 * 2&#10;totale"></textarea>
          </div>
          <div id="results" title="Clic su un risultato per copiarlo"></div>
        </section>

        <!-- Tab di testo in markdown -->
        <section id="notes-view" class="view">
          <article id="md-preview" class="markdown"></article>
          <textarea id="md-editor" spellcheck="false" hidden
            placeholder="# Titolo&#10;Testo in **markdown**, con richiami ai calcoli: @1 oppure @1*Calcoli"></textarea>
          <button id="md-toggle" title="Modifica / Anteprima (Ctrl+E)">Modifica</button>
        </section>
      </main>

      <!-- Barra dei tab, in basso -->
      <footer id="tabbar">
        <nav id="tabs"></nav>
        <button id="add-tab" class="icon-btn" title="Nuovo tab (Ctrl+N)">
          <svg viewBox="0 0 16 16"><path d="M7.4 2h1.2v5.4H14v1.2H8.6V14H7.4V8.6H2V7.4h5.4z"/></svg>
        </button>
        <button id="keypad-on" class="mobile-only" hidden title="Torna al tastierino calcolatrice">123</button>
        <button id="settings-btn-bottom" class="icon-btn mobile-only" title="Impostazioni">
          <svg viewBox="0 0 16 16"><path d="M7 1h2l.4 1.9 1.3.6 1.7-1 1.4 1.4-1 1.7.6 1.3L15 7v2l-1.9.4-.6 1.3 1 1.7-1.4 1.4-1.7-1-1.3.6L9 15H7l-.4-1.9-1.3-.6-1.7 1-1.4-1.4 1-1.7-.6-1.3L1 9V7l1.9-.4.6-1.3-1-1.7 1.4-1.4 1.7 1 1.3-.6zm1 4.5a2.5 2.5 0 1 0 0 5 2.5 2.5 0 0 0 0-5"/></svg>
        </button>
      </footer>

      <!-- Tastierino calcolatrice (solo telefono, nei tab di calcolo) -->
      <div id="keypad" hidden>
        <button data-key="(">(</button><button data-key=")">)</button><button data-key="%">%</button><button data-key="^">^</button><button data-action="back" class="fn" title="Cancella">⌫</button>
        <button data-key="7">7</button><button data-key="8">8</button><button data-key="9">9</button><button data-key="/" class="op">÷</button><button data-key="@" class="op">@</button>
        <button data-key="4">4</button><button data-key="5">5</button><button data-key="6">6</button><button data-key="*" class="op">×</button><button data-key="_" class="op">_</button>
        <button data-key="1">1</button><button data-key="2">2</button><button data-key="3">3</button><button data-key="-" class="op">−</button><button data-key="=" class="op">=</button>
        <button data-action="abc" class="fn" title="Tastiera completa">ABC</button><button data-key="0">0</button><button data-key="," id="decimal-key">,</button><button data-key="+" class="op">+</button><button data-action="enter" class="fn enter" title="A capo">↵</button>
      </div>

      <!-- Nuovo tab / modifica tab -->
      <div id="tab-dialog" class="overlay" hidden>
        <form id="tab-form" class="panel">
          <h2 id="tab-dialog-title">Nuovo tab</h2>
          <label>Nome <input id="tab-name" maxlength="40" autocomplete="off" spellcheck="false" /></label>
          <div class="field" id="tab-type-field">
            <span>Tipo</span>
            <div class="segmented">
              <button type="button" data-type="calc" title="Righe di calcolo con i risultati a destra">Calcoli</button>
              <button type="button" data-type="text" title="Testo libero in markdown, con richiami ai calcoli">Testo</button>
            </div>
          </div>
          <div class="actions">
            <button type="button" id="tab-delete" class="danger">Elimina</button>
            <span class="spacer"></span>
            <button type="button" id="tab-cancel">Annulla</button>
            <button type="submit" id="tab-ok" class="primary">Crea</button>
          </div>
        </form>
      </div>

      <!-- Impostazioni -->
      <div id="settings" class="overlay" hidden>
        <div class="panel">
          <h2>Impostazioni</h2>
          <div class="presets"></div>
          <label>Sfondo <input type="color" data-color="bg" /></label>
          <label>Testo <input type="color" data-color="text" /></label>
          <label>Accento calcoli <input type="color" data-color="calc" /></label>
          <label>Accento risultati <input type="color" data-color="result" /></label>
          <div class="field">
            <span>Notazione numeri</span>
            <div class="segmented" id="notation">
              <button data-notation="eu" title="Europea: punto per le migliaia, virgola per i decimali">1.234,56</button>
              <button data-notation="en" title="Anglosassone: virgola per le migliaia, punto per i decimali">1,234.56</button>
            </div>
          </div>
          <div class="field">
            <span>Dimensione testo</span>
            <div class="segmented">
              <button id="font-down" title="Riduci (Ctrl −)">A−</button>
              <button id="font-up" title="Ingrandisci (Ctrl +)">A+</button>
            </div>
          </div>
          <label class="check mobile-only-block">
            <input type="checkbox" id="keypad-setting" />
            <span>Tastierino calcolatrice<small>Nei tab di calcolo, al posto della tastiera del telefono compare un tastierino con cifre e operatori; ABC apre la tastiera completa.</small></span>
          </label>
          <label class="check windows-only">
            <input type="checkbox" id="autostart" />
            <span>Avvia con Windows<small>Calchy parte nascosta all'accesso: Ctrl+Alt+C la mostra.</small></span>
          </label>
          <label class="check linux-only">
            <input type="checkbox" id="native-wayland" />
            <span>Wayland nativo<small>Testo più nitido con lo zoom, ma GNOME non permette "sempre in primo piano". Richiede il riavvio di Calchy (Ctrl+Q).</small></span>
          </label>
          <div class="actions">
            <button id="reset-colors">Colori predefiniti</button>
            <button id="settings-close" class="primary">Fatto</button>
          </div>
        </div>
      </div>

      <div id="toast" role="status"></div>
    </div>
  </body>
</html>
