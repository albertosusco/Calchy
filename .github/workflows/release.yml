# Crea l'RPM (Fedora) e l'APK (Android) e li pubblica nella pagina "Releases" di GitHub.
# Si avvia da solo quando su "main" arriva un numero di versione nuovo
# (campo "version" di src-tauri/tauri.conf.json), oppure con un tag v1.2.3.
name: Release

on:
  push:
    branches: [main]
    tags: ["v*"]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  version:
    name: Controlla la versione
    runs-on: ubuntu-latest
    outputs:
      version: ${{ steps.v.outputs.version }}
      build: ${{ steps.v.outputs.build }}
      publish: ${{ steps.v.outputs.publish }}
    steps:
      - uses: actions/checkout@v4
      - id: v
        run: |
          VERSION=$(node -p "require('./src-tauri/tauri.conf.json').version")
          if [[ "$GITHUB_REF_TYPE" == "tag" ]]; then
            VERSION="${GITHUB_REF_NAME#v}"
            PUBLISH=true
          elif git ls-remote --exit-code --tags origin "refs/tags/v$VERSION" >/dev/null; then
            PUBLISH=false   # questa versione è già pubblicata
          else
            PUBLISH=true    # versione nuova: si pubblica
          fi
          # una prova manuale (Actions -> Run workflow) compila sempre
          BUILD=$PUBLISH
          [[ "$GITHUB_EVENT_NAME" == "workflow_dispatch" ]] && BUILD=true
          echo "Versione $VERSION, compila: $BUILD, pubblica: $PUBLISH"
          echo "version=$VERSION" >> "$GITHUB_OUTPUT"
          echo "build=$BUILD" >> "$GITHUB_OUTPUT"
          echo "publish=$PUBLISH" >> "$GITHUB_OUTPUT"

  rpm:
    name: RPM per Fedora
    needs: version
    if: needs.version.outputs.build == 'true'
    runs-on: ubuntu-latest
    container: fedora:44
    steps:
      - name: Installa gli strumenti di compilazione
        run: |
          dnf install -y git nodejs npm rust cargo gcc \
            webkit2gtk4.1-devel gtk3-devel librsvg2-devel openssl-devel

      - uses: actions/checkout@v4

      - uses: actions/cache@v4
        with:
          path: |
            ~/.cargo/registry
            src-tauri/target
          key: fedora44-${{ hashFiles('src-tauri/Cargo.lock') }}

      - name: Dipendenze JavaScript
        run: npm ci

      - name: Test del motore di calcolo
        run: npm test

      - name: Compila l'RPM
        run: npx tauri build --bundles rpm --config '{"version":"${{ needs.version.outputs.version }}"}'

      - uses: actions/upload-artifact@v4
        with:
          name: rpm
          path: src-tauri/target/release/bundle/rpm/*.rpm

  apk:
    name: APK per Android
    needs: version
    if: needs.version.outputs.build == 'true'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17

      - name: Strumenti Android e Rust
        run: |
          # Android SDK e NDK sono già installati sulle macchine di GitHub
          echo "NDK_HOME=$ANDROID_NDK_LATEST_HOME" >> "$GITHUB_ENV"
          rustup target add aarch64-linux-android

      - uses: actions/cache@v4
        with:
          path: |
            ~/.cargo/registry
            ~/.gradle/caches
            src-tauri/target
          key: android-${{ hashFiles('src-tauri/Cargo.lock') }}

      - name: Dipendenze JavaScript
        run: npm ci

      - name: Prepara il progetto Android
        run: |
          npx tauri android init --ci
          npx tauri icon app-icon.png

      - name: Compila l'APK
        run: |
          VERSION="${{ needs.version.outputs.version }}"
          npx tauri android build --apk --target aarch64 --config "{\"version\":\"$VERSION\"}"
          echo "VERSION=$VERSION" >> "$GITHUB_ENV"

      - name: Firma l'APK
        env:
          KEYSTORE_B64: ${{ secrets.ANDROID_KEYSTORE }}
          KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
        run: |
          BUILD_TOOLS=$(ls -d "$ANDROID_HOME"/build-tools/* | sort -V | tail -1)
          UNSIGNED=$(find src-tauri/gen/android/app/build/outputs/apk -name "*release*.apk" | head -1)
          echo "APK da firmare: $UNSIGNED"

          if [[ -n "$KEYSTORE_B64" ]]; then
            echo "$KEYSTORE_B64" | base64 -d > release.jks
            PASS="$KEYSTORE_PASSWORD"
          else
            # Senza chiave salvata nei Secrets se ne crea una temporanea: l'APK si installa,
            # ma per aggiornarlo bisognerà prima disinstallare la versione precedente.
            echo "::warning::Chiave ANDROID_KEYSTORE non trovata nei Secrets: uso una chiave temporanea"
            PASS=temporanea
            keytool -genkeypair -keystore release.jks -alias calchy -keyalg RSA -keysize 2048 \
              -validity 10000 -storepass "$PASS" -keypass "$PASS" -dname "CN=Calchy"
          fi

          mkdir -p out
          "$BUILD_TOOLS/zipalign" -p -f 4 "$UNSIGNED" aligned.apk
          "$BUILD_TOOLS/apksigner" sign --ks release.jks --ks-pass "pass:$PASS" \
            --out "out/Calchy-$VERSION-android.apk" aligned.apk
          "$BUILD_TOOLS/apksigner" verify "out/Calchy-$VERSION-android.apk"
          rm release.jks

      - uses: actions/upload-artifact@v4
        with:
          name: apk
          path: out/*.apk

  publish:
    name: Pubblica la release
    needs: [version, rpm, apk]
    if: needs.version.outputs.publish == 'true'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/download-artifact@v4
        with:
          path: files
          merge-multiple: true

      - uses: softprops/action-gh-release@v2
        with:
          tag_name: v${{ needs.version.outputs.version }}
          name: Calchy ${{ needs.version.outputs.version }}
          target_commitish: ${{ github.sha }}
          files: files/*
          generate_release_notes: true
